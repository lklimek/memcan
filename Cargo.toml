[workspace]
resolver = "2"
members = [
    "rs/memcan-core",
    "rs/memcan-server",
    "rs/memcan",
]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/lklimek/memcan"

[workspace.dependencies]
# Core
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "io-std", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.11"
sha2 = "0.11"
hex = "0.4.3"
dotenvy = "0.15"
dirs = "7.0.0"

# Async
async-trait = "0.1"
futures = "0.3"

# Embeddings (in-process ONNX, text models only — no image-models)
fastembed = { version = "7.5.0", default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries-native-tls"] }

# Multi-provider LLM
genai = "0.7"
ollama-rs = { version = "0.3", features = ["headers"] }

# HTTP (used by memcan-test-classification)
reqwest = { version = "0.13", features = ["json"] }

# Vector DB
lancedb = "0.41"
arrow-array = "58"
arrow-schema = "58"

# MCP
rmcp = { version = "3.8.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.3"

# HTTP server
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23.1"
bytes = "1"
http-body-util = "0.1"
maud = { version = "0.27.0", features = ["axum"] }
percent-encoding = "2.3.2"
tower-http = { version = "0.7.1", default-features = false, features = ["timeout"] }

# Crypto
subtle = "2"

# CLI
clap_complete = "4"

# Caching
lru = "0.19.0"

# Regex
regex = "1"

# Testing
mockito = "1"
tempfile = "3"
serial_test = "4"
tower = { version = "0.5", features = ["util"] }

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
strip = true
lto = "thin"
