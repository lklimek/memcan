name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag override (defaults to "nightly")'
        required: false
        default: 'nightly'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: lklimek/memcan
  REGISTRY: docker.io

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: actions/checkout@v4

      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
            # Add "latest" only for full (non-pre) releases
            if [ "${{ github.event.release.prerelease }}" = "false" ]; then
              TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            fi
          else
            # workflow_dispatch — use user-supplied tag or "nightly"
            OVERRIDE="${{ github.event.inputs.tag }}"
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${OVERRIDE:-nightly}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # Build tag arguments for imagetools
          TAG_ARGS=$(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | xargs -I{} echo "-t {}" | tr '\n' ' ')
          # Create manifest list from all platform digests
          docker buildx imagetools create $TAG_ARGS \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          TAG=$(echo "${{ steps.tags.outputs.tags }}" | cut -d',' -f1)
          docker buildx imagetools inspect "$TAG"
