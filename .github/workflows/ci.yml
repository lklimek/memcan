name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: actions/checkout@v4
      - name: Install Ubuntu dependencies
        run: bash scripts/setup-ubuntu.sh
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: dtolnay/rust-toolchain@stable
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: actions/checkout@v4
      - name: Install Ubuntu dependencies
        run: bash scripts/setup-ubuntu.sh
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: dtolnay/rust-toolchain@stable
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  features:
    # memcan-core's LLM backends are optional features, but every other job
    # builds the default (both-on) combination only. Without this matrix the
    # cfg branches selecting a single backend are never compiled or run.
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: genai-only
            flags: --no-default-features --features genai-llm
          - name: ollama-rs-only
            flags: --no-default-features --features ollama-rs-llm
          - name: no-llm-backend
            flags: --no-default-features
    steps:
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: actions/checkout@v4
      - name: Install Ubuntu dependencies
        run: bash scripts/setup-ubuntu.sh
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: dtolnay/rust-toolchain@stable
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p memcan-core ${{ matrix.flags }}
      - run: cargo test -p memcan-core ${{ matrix.flags }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: actions/checkout@v4
      - name: Install Ubuntu dependencies
        run: bash scripts/setup-ubuntu.sh
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: actions/checkout@v4
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      # INTENTIONAL(SEC-011): Version tags used instead of commit SHAs — accepted risk for readability
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit
